server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # API: proxy al contenedor del backend conservando la ruta (/api/...).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # sympy puede tardar en algunos despejes o derivadas.
        proxy_read_timeout 120s;
    }

    # Archivos con hash de Vite: nunca cambian de contenido, caché larga.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html sin caché, para que tras reconstruir se carguen los assets nuevos.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rutas de Vue Router (createWebHistory): /resolver/<método>, /teoria/<método>...
    location / {
        try_files $uri $uri/ /index.html;
    }
}
