<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v= obliga al navegador a soltar el favicon que tiene en caché. -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="32x32">
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
    <link rel="icon" href="/favicon-32x32.png?v=3" type="image/png" sizes="32x32">
    <link rel="icon" href="/favicon-16x16.png?v=3" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
    <meta name="theme-color" content="#0b4a5a">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Métodos Iterativos</title>
    <!-- IBM Plex Sans 400 es el peso de casi todo el texto: se pide antes de que llegue el CSS. -->
    <link
      rel="preload"
      href="/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Tema antes del primer pintado, para que no destelle en blanco. La
         misma lógica (y la misma clave) que composables/useTheme.js. -->
    <script>
      (function () {
        var theme = null
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <!-- En desarrollo el CSS llega con el JS: mientras tanto, fondo oscuro nativo. -->
    <style>
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
